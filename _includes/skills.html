<div class="section-wrapper">
  <section class="section skills" id="skills">
    <div class="full-width skills-layout">

      <!-- LEFT: title (vertical stack) -->
      <div class="skills-sidebar">
        <div class="section-heading" id="skills-text">Skills</div>
      </div>

      <!-- RIGHT: cards grid -->
      <div class="skills-content">
        <div class="skills-cards">
          <!-- Engineering Tools -->
          <div class="skills-card">
            <div class="skills-card-title">Engineering Tools</div>

            <div class="progress-bars">
              <div class="skillbar clearfix" style="--percent: 80%" data-level="good">
                <div class="skillbar-title"><span>LabVIEW</span></div>
                <div class="skillbar-bar"></div>
              </div>

              <div class="skillbar clearfix" style="--percent: 40%" data-level="bad">
                <div class="skillbar-title"><span>ANSYS</span></div>
                <div class="skillbar-bar"></div>
              </div>

              <div class="skillbar clearfix" style="--percent: 100%" data-level="excellent">
                <div class="skillbar-title"><span>Fusion360</span></div>
                <div class="skillbar-bar"></div>
              </div>
            </div>
          </div>

          <!-- Languages -->
          <div class="skills-card">
            <div class="skills-card-title">Languages</div>

            <div class="progress-bars">
              <div class="skillbar clearfix" style="--percent: 100%" data-level="excellent">
                <div class="skillbar-title"><span>Korean</span></div>
                <div class="skillbar-bar"></div>
              </div>

              <div class="skillbar clearfix" style="--percent: 80%" data-level="good">
                <div class="skillbar-title"><span>English</span></div>
                <div class="skillbar-bar"></div>
              </div>
            </div>
          </div>

          <!-- Programming -->
          <div class="skills-card">
            <div class="skills-card-title">Programming</div>

            <div class="progress-bars">
              <div class="skillbar clearfix" style="--percent: 80%" data-level="good">
                <div class="skillbar-title"><span>MATLAB</span></div>
                <div class="skillbar-bar"></div>
              </div>

              <div class="skillbar clearfix" style="--percent: 40%" data-level="bad">
                <div class="skillbar-title"><span>Python</span></div>
                <div class="skillbar-bar"></div>
              </div>

              <div class="skillbar clearfix" style="--percent: 60%" data-level="average">
                <div class="skillbar-title"><span>LaTEX</span></div>
                <div class="skillbar-bar"></div>
              </div>

              <div class="skillbar clearfix" style="--percent: 60%" data-level="average">
                <div class="skillbar-title"><span>Arduino IDE</span></div>
                <div class="skillbar-bar"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </section>
</div>
